name: ${COMPOSE_PROJECT_NAME:-creemseed}
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run the setup script first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
